# WAN-REJECT scenarios (docs/ARCHITECTURE.md §4.5): new WAN connections the
# node's firewall refused (closed or filtered ports; accepted services and
# port forwards are not logged). Sources of such packets can be spoofed, so
# UDP never leads to a decision and TCP decisions stay short.

# One source probing many closed ports of one node.
type: leaky
name: openpicket/wan-reject-portscan
description: "Port scan of a node (10 distinct closed TCP ports)"
filter: |
  evt.Meta.log_type == "openpicket_nflog" && evt.Meta.nflog_prefix == "WAN-REJECT" && evt.Meta.source_ip != "" && evt.Parsed.proto == "TCP"
groupby: evt.Meta.source_ip + "/" + evt.Meta.node_id
distinct: evt.Meta.dest_port
capacity: 9
leakspeed: 30s
blackhole: 5m
labels:
  service: openpicket
  remediation: true
  confidence: 2
  spoofable: 2
  classification:
    - attack.T1046
  behavior: "tcp:scan"
  label: "Port scan (refused WAN connections)"
---
# The same source seen by several nodes: only a central detector sees this.
type: leaky
name: openpicket/wan-reject-distributed
description: "Scanning several OpenPicket nodes (3 distinct nodes)"
filter: |
  evt.Meta.log_type == "openpicket_nflog" && evt.Meta.nflog_prefix == "WAN-REJECT" && evt.Meta.source_ip != "" && evt.Parsed.proto == "TCP"
groupby: evt.Meta.source_ip
distinct: evt.Meta.node_id
capacity: 2
leakspeed: 10m
blackhole: 30m
labels:
  service: openpicket
  remediation: true
  confidence: 3
  spoofable: 2
  classification:
    - attack.T1046
  behavior: "tcp:scan"
  label: "Distributed scan (refused WAN connections)"
---
# Repeated attempts on remote administration and file sharing ports.
type: leaky
name: openpicket/wan-reject-sensitive-port
description: "Repeated attempts on sensitive closed ports (3 attempts)"
filter: |
  evt.Meta.log_type == "openpicket_nflog" && evt.Meta.nflog_prefix == "WAN-REJECT" && evt.Meta.source_ip != "" && evt.Parsed.proto == "TCP" &&
  evt.Meta.dest_port in ["22", "23", "445", "1433", "3306", "3389", "5432", "5900", "6379"]
groupby: evt.Meta.source_ip
capacity: 2
leakspeed: 60s
blackhole: 5m
labels:
  service: openpicket
  remediation: true
  confidence: 2
  spoofable: 2
  classification:
    - attack.T1110
  behavior: "tcp:scan"
  label: "Sensitive port probing (refused WAN connections)"
---
# UDP: alert only.
type: leaky
name: openpicket/wan-reject-udp-scan
description: "UDP port scan of a node (alert only: UDP sources are spoofable)"
filter: |
  evt.Meta.log_type == "openpicket_nflog" && evt.Meta.nflog_prefix == "WAN-REJECT" && evt.Meta.source_ip != "" && evt.Parsed.proto == "UDP"
groupby: evt.Meta.source_ip + "/" + evt.Meta.node_id
distinct: evt.Meta.dest_port
capacity: 9
leakspeed: 30s
blackhole: 5m
labels:
  service: openpicket
  remediation: false
  confidence: 1
  spoofable: 3
  classification:
    - attack.T1046
  behavior: "udp:scan"
  label: "UDP scan (refused WAN connections)"

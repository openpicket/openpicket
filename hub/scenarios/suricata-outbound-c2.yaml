# Direction-aware Suricata scenarios (docs/ARCHITECTURE.md §4.7). They replace
# the crowdsecurity/suricata scenarios, which ban eve's src_ip. Here
# evt.Meta.source_ip is the remote party, and the scenario name tells the
# relay how to block: openpicket/suricata-outbound-* is blocked both ways
# (BOTH), everything else inbound only.

# Outbound to a C2 / malware endpoint over TCP: the remote side is the
# endpoint the inside host connected to, so it is not spoofable.
type: trigger
name: openpicket/suricata-outbound-c2
description: "Inside host talks to a malware / C2 endpoint (TCP)"
filter: |
  evt.Meta.log_type == "suricata_alert" && evt.Meta.openpicket_direction == "outbound" && evt.Meta.source_ip != "" &&
  evt.Parsed.proto == "TCP" &&
  (evt.Meta.suricata_rule_severity == "1" || evt.Parsed.suricata_alert_category in [
    "A Network Trojan was detected",
    "Malware Command and Control Activity Detected",
    "Domain Observed Used for C2 Detected",
    "Crypto Currency Mining Activity Detected",
    "Exploit Kit Activity Detected"])
groupby: evt.Meta.source_ip
blackhole: 5m
reprocess: true
labels:
  service: suricata
  remediation: true
  confidence: 3
  spoofable: 0
  classification:
    - attack.T1071
  behavior: "generic:malware"
  label: "Outbound C2 (TCP)"

# Direction-aware Suricata scenarios (docs/ARCHITECTURE.md §4.7). They replace
# the crowdsecurity/suricata scenarios, which ban eve's src_ip. Here
# evt.Meta.source_ip is the remote party, and the scenario name tells the
# relay how to block: openpicket/suricata-outbound-* is blocked both ways
# (BOTH), everything else inbound only.

# Inbound, severity 1: kill on sight (as crowdsecurity/suricata-major-severity).
type: trigger
name: openpicket/suricata-inbound-major
description: "Inbound exploit attempt (Suricata severity 1)"
filter: |
  evt.Meta.log_type == "suricata_alert" && evt.Meta.openpicket_direction == "inbound" && evt.Meta.source_ip != "" &&
  evt.Parsed.proto == "TCP" && evt.Meta.suricata_rule_severity == "1"
groupby: evt.Meta.source_ip
blackhole: 1m
reprocess: true
labels:
  service: suricata
  remediation: true
  confidence: 2
  spoofable: 1
  classification:
    - attack.T1190
  behavior: "generic:exploit"
  label: "Suricata inbound severity 1"
---
# Inbound, severity 2: three different signatures within the bucket.
type: leaky
name: openpicket/suricata-inbound-high-medium
description: "Inbound exploit attempts (3 distinct Suricata severity 2 signatures)"
filter: |
  evt.Meta.log_type == "suricata_alert" && evt.Meta.openpicket_direction == "inbound" && evt.Meta.source_ip != "" &&
  evt.Parsed.proto == "TCP" && evt.Meta.suricata_rule_severity == "2"
groupby: evt.Meta.source_ip
distinct: evt.Meta.suricata_alert_signature_id
capacity: 2
leakspeed: 20s
blackhole: 1m
reprocess: true
labels:
  service: suricata
  remediation: true
  confidence: 2
  spoofable: 1
  classification:
    - attack.T1190
    - attack.T1595
  behavior: "generic:exploit"
  label: "Suricata inbound severity 2"
---
# Outbound to a C2 / malware endpoint over TCP: the remote side is the
# endpoint the inside host connected to, so it is not spoofable.
type: trigger
name: openpicket/suricata-outbound-c2
description: "Inside host talks to a malware / C2 endpoint (TCP)"
filter: |
  evt.Meta.log_type == "suricata_alert" && evt.Meta.openpicket_direction == "outbound" && evt.Meta.source_ip != "" &&
  evt.Parsed.proto == "TCP" &&
  (evt.Meta.suricata_rule_severity == "1" || evt.Parsed.suricata_alert_category in [
    "A Network Trojan was detected",
    "Malware Command and Control Activity Detected",
    "Domain Observed Used for C2 Detected",
    "Crypto Currency Mining Activity Detected",
    "Exploit Kit Activity Detected"])
groupby: evt.Meta.source_ip
blackhole: 5m
reprocess: true
labels:
  service: suricata
  remediation: true
  confidence: 3
  spoofable: 0
  classification:
    - attack.T1071
  behavior: "generic:malware"
  label: "Outbound C2 (TCP)"
---
# The same over UDP and other protocols: wait for repeats.
type: leaky
name: openpicket/suricata-outbound-c2-udp
description: "Inside host talks to a malware / C2 endpoint (UDP and others, repeated)"
filter: |
  evt.Meta.log_type == "suricata_alert" && evt.Meta.openpicket_direction == "outbound" && evt.Meta.source_ip != "" &&
  evt.Parsed.proto != "TCP" &&
  (evt.Meta.suricata_rule_severity == "1" || evt.Parsed.suricata_alert_category in [
    "A Network Trojan was detected",
    "Malware Command and Control Activity Detected",
    "Domain Observed Used for C2 Detected",
    "Crypto Currency Mining Activity Detected"])
groupby: evt.Meta.source_ip
capacity: 2
leakspeed: 5m
blackhole: 5m
reprocess: true
labels:
  service: suricata
  remediation: true
  confidence: 2
  spoofable: 0
  classification:
    - attack.T1071
  behavior: "generic:malware"
  label: "Outbound C2 (UDP)"
---
# The inside side of the same events: an alert about the host, without a
# decision (remediation false). The custom scope makes the alert's source
# the inside host.
type: trigger
name: openpicket/compromised-host
description: "Inside host shows malware / C2 activity"
filter: |
  evt.Meta.log_type == "suricata_alert" && evt.Meta.openpicket_direction == "outbound" && evt.Meta.openpicket_local_ip != "" &&
  (evt.Meta.suricata_rule_severity == "1" || evt.Parsed.suricata_alert_category in [
    "A Network Trojan was detected",
    "Malware Command and Control Activity Detected",
    "Domain Observed Used for C2 Detected",
    "Crypto Currency Mining Activity Detected",
    "Exploit Kit Activity Detected"])
groupby: evt.Meta.openpicket_local_ip
scope:
  type: openpicket_host
  expression: evt.Meta.openpicket_local_ip
blackhole: 1h
reprocess: false
labels:
  service: suricata
  remediation: false
  confidence: 3
  spoofable: 0
  classification:
    - attack.T1071
  behavior: "generic:malware"
  label: "Compromised host"

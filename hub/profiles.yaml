# Decision profiles of the OpenPicket CrowdSec image. Scenarios with
# remediation: false (compromised host, UDP scans) produce alerts only.

name: openpicket_long_ip_remediation
filters:
 - Alert.Remediation == true && Alert.GetScope() == "Ip" && Alert.GetScenario() in ["openpicket/dnat-miss-distributed", "openpicket/suricata-outbound-c2", "openpicket/suricata-outbound-c2-udp"]
decisions:
 - type: ban
   duration: 24h
on_success: break
---
name: default_ip_remediation
filters:
 - Alert.Remediation == true && Alert.GetScope() == "Ip"
decisions:
 - type: ban
   duration: 4h
on_success: break
---
name: default_range_remediation
filters:
 - Alert.Remediation == true && Alert.GetScope() == "Range"
decisions:
 - type: ban
   duration: 4h
on_success: break

syntax = "proto3";

package openpicket.api.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/openpicket/openpicket/gen/openpicket/api/v1;apiv1";

// Alerts and decisions of the CrowdSec LAPIs (cached in PostgreSQL by the
// leader for search and facets).
service AlertService {
  rpc SearchAlerts(SearchAlertsRequest) returns (SearchAlertsResponse);
  rpc GetAlert(GetAlertRequest) returns (GetAlertResponse);
  rpc Facets(FacetsRequest) returns (FacetsResponse);
  rpc DeleteAlerts(DeleteAlertsRequest) returns (DeleteAlertsResponse);
}

service DecisionService {
  rpc SearchDecisions(SearchDecisionsRequest) returns (SearchDecisionsResponse);
  rpc AddDecision(AddDecisionRequest) returns (AddDecisionResponse);
  rpc DeleteDecisions(DeleteDecisionsRequest) returns (DeleteDecisionsResponse);
  // Delete every decision (and optionally alert) of an address.
  rpc CleanupIP(CleanupIPRequest) returns (CleanupIPResponse);
  // How a value's decision reached the nodes.
  rpc GetPropagation(GetPropagationRequest) returns (GetPropagationResponse);
}

service DashboardService {
  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse);
}

message Source {
  string scope = 1;
  string value = 2;
  string ip = 3;
  string range = 4;
  string country = 5;
  string as_number = 6;
  string as_name = 7;
  float latitude = 8;
  float longitude = 9;
}

message MetaValue {
  string key = 1;
  repeated string values = 2;
}

message AlertDecision {
  int64 id = 1;
  string type = 2;
  string scope = 3;
  string value = 4;
  string origin = 5;
  string scenario = 6;
  google.protobuf.Timestamp until = 7;
  bool active = 8;
}

message Alert {
  string instance = 1;
  int64 id = 2;
  string uuid = 3;
  string scenario = 4;
  string message = 5;
  Source source = 6;
  int32 events_count = 7;
  bool simulated = 8;
  bool remediation = 9;
  string machine_id = 10;
  google.protobuf.Timestamp start_at = 11;
  google.protobuf.Timestamp stop_at = 12;
  google.protobuf.Timestamp created_at = 13;
  // Alert context (node_id, direction, dst_ip, dst_port, signature...).
  repeated MetaValue meta = 14;
  repeated AlertDecision decisions = 15;
  // Convenience copies of context values.
  string node_id = 16;
  string direction = 17;
}

message SearchAlertsRequest {
  // Search syntax: free text, "phrases", field:contains, field=exact,
  // field>value / field<value (dates, numbers), -negation, field:"" (empty),
  // AND / OR / parentheses.
  string query = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  int32 limit = 4;
  int32 offset = 5;
  // Instance id; empty = combined.
  string instance = 6;
  bool include_simulated = 7;
  // created_at (default) | events_count | scenario
  string order_by = 8;
  bool ascending = 9;
}

message SearchAlertsResponse {
  repeated Alert alerts = 1;
  int64 total = 2;
}

message GetAlertRequest {
  string instance = 1;
  int64 id = 2;
}

message GetAlertResponse {
  Alert alert = 1;
  // Raw events of the alert (JSON).
  string events_json = 2;
}

message FacetsRequest {
  string query = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  string instance = 4;
  // Fields: scenario, country, as_name, node, direction, origin,
  // machine, value. Each facet ignores its own clause of the query.
  repeated string fields = 5;
  // Search within a facet's values.
  string value_prefix = 6;
  int32 limit = 7;
  bool include_simulated = 8;
}

message FacetValue {
  string value = 1;
  int64 count = 2;
}

message Facet {
  string field = 1;
  repeated FacetValue values = 2;
}

message FacetsResponse {
  repeated Facet facets = 1;
}

message DeleteAlertsRequest {
  string instance = 1;
  repeated int64 ids = 2;
}

message DeleteAlertsResponse {
  int64 deleted = 1;
  repeated InstanceError errors = 2;
}

message InstanceError {
  string instance = 1;
  string error = 2;
}

message Decision {
  string instance = 1;
  int64 id = 2;
  string type = 3;
  string scope = 4;
  string value = 5;
  string origin = 6;
  string scenario = 7;
  google.protobuf.Timestamp until = 8;
  bool active = 9;
  // inbound | both at the edge, empty when it does not apply there.
  string edge_direction = 10;
  int64 alert_id = 11;
  string country = 12;
  string as_name = 13;
}

message SearchDecisionsRequest {
  string query = 1;
  bool include_expired = 2;
  // Hide decisions duplicating an active one for the same value.
  bool hide_duplicates = 3;
  int32 limit = 4;
  int32 offset = 5;
  string instance = 6;
}

message SearchDecisionsResponse {
  repeated Decision decisions = 1;
  int64 total = 2;
}

message AddDecisionRequest {
  // Ip | Range | Country | AS
  string scope = 1;
  string value = 2;
  // "4h", "30d"
  string duration = 3;
  string reason = 4;
  // ban | captcha
  string type = 5;
  // Default openpicket/manual; openpicket/manual-both blocks both ways at
  // the edge.
  string scenario = 6;
  // Empty: every instance (combined).
  string instance = 7;
}

message AddDecisionResponse {
  repeated InstanceError errors = 1;
}

message DeleteDecisionsRequest {
  string instance = 1;
  repeated int64 ids = 2;
}

message DeleteDecisionsResponse {
  int64 deleted = 1;
  repeated InstanceError errors = 2;
}

message CleanupIPRequest {
  string ip = 1;
  bool delete_alerts = 2;
  string instance = 3;
}

message CleanupIPResponse {
  int64 decisions_deleted = 1;
  int64 alerts_deleted = 2;
  repeated InstanceError errors = 3;
}

message GetPropagationRequest {
  string value = 1;
}

message NodePropagation {
  string node_id = 1;
  uint64 acked_version = 2;
  // Received and in force on the node.
  bool applied = 3;
  bool connected = 4;
  google.protobuf.Timestamp acked_at = 5;
  string error = 6;
  // Received but not in force: the node's reason (its allowlist, local
  // networks, element limit, or the enforcer turned off).
  string refused = 7;
  // The node does not report every decision it refuses (over its element
  // limit): this one may be among them.
  bool maybe_refused = 8;
}

message GetPropagationResponse {
  bool at_edge = 1;
  string direction = 2;
  uint64 version = 3;
  google.protobuf.Timestamp until = 4;
  repeated NodePropagation nodes = 5;
  repeated Decision decisions = 6;
  // The edge decision blocking the value: the value itself or, for an
  // address, the range containing it that blocks the longest.
  string edge_value = 7;
}

message GetSummaryRequest {
  google.protobuf.Timestamp from = 1;
  google.protobuf.Timestamp to = 2;
  string query = 3;
  string instance = 4;
  bool include_simulated = 5;
}

message TimeBucket {
  google.protobuf.Timestamp start = 1;
  int64 alerts = 2;
  int64 decisions = 3;
}

message MapPoint {
  string country = 1;
  int64 count = 2;
}

message GetSummaryResponse {
  int64 alerts = 1;
  int64 active_decisions = 2;
  int64 simulated_alerts = 3;
  repeated TimeBucket series = 4;
  repeated FacetValue top_countries = 5;
  repeated FacetValue top_scenarios = 6;
  repeated FacetValue top_as = 7;
  repeated FacetValue top_nodes = 8;
  repeated FacetValue top_sources = 9;
  repeated MapPoint map = 10;
  int64 nodes_online = 11;
  int64 nodes_total = 12;
  int64 compromised_hosts = 13;
}

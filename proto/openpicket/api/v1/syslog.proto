syntax = "proto3";

package openpicket.api.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/openpicket/openpicket/gen/openpicket/api/v1;apiv1";

// Syslog devices: equipment without an agent sending syslog to the
// gateways, identified by its address.
service SyslogService {
  rpc ListSyslogDevices(ListSyslogDevicesRequest) returns (ListSyslogDevicesResponse);
  // Creates (create) or replaces a device.
  rpc PutSyslogDevice(PutSyslogDeviceRequest) returns (PutSyslogDeviceResponse);
  rpc DeleteSyslogDevice(DeleteSyslogDeviceRequest) returns (DeleteSyslogDeviceResponse);
  // Senders and their message counts.
  rpc ListSyslogSenders(ListSyslogSendersRequest) returns (ListSyslogSendersResponse);
  rpc GetSyslogSettings(GetSyslogSettingsRequest) returns (GetSyslogSettingsResponse);
  rpc SetSyslogSettings(SetSyslogSettingsRequest) returns (SetSyslogSettingsResponse);
}

message SyslogDevice {
  // Shares the namespace of node ids.
  string id = 1;
  string description = 2;
  // Addresses or networks (CIDR) the device sends from.
  repeated string sources = 3;
  map<string, string> labels = 4;
  // Program names by syslog tag; the key "*" names lines without a
  // syslog header.
  map<string, string> programs = 5;
  bool enabled = 6;
  google.protobuf.Timestamp updated_at = 7;
  string updated_by = 8;
  // Received (read only): messages and programs seen.
  int64 messages = 9;
  google.protobuf.Timestamp last_seen = 10;
  repeated string seen_programs = 11;
}

message ListSyslogDevicesRequest {}

message ListSyslogDevicesResponse {
  repeated SyslogDevice devices = 1;
}

message PutSyslogDeviceRequest {
  SyslogDevice device = 1;
  // Fails if the device exists.
  bool create = 2;
}

message PutSyslogDeviceResponse {
  SyslogDevice device = 1;
}

message DeleteSyslogDeviceRequest {
  string id = 1;
}

message DeleteSyslogDeviceResponse {}

message SyslogSender {
  string addr = 1;
  // The device its messages were taken for; empty: unregistered.
  string device_id = 2;
  int64 messages = 3;
  // Messages dropped (unregistered sender, disabled device).
  int64 dropped = 4;
  // The latest message (truncated).
  string sample = 5;
  google.protobuf.Timestamp first_seen = 6;
  google.protobuf.Timestamp last_seen = 7;
}

message ListSyslogSendersRequest {
  // Only senders no device matches.
  bool unregistered = 1;
}

message ListSyslogSendersResponse {
  repeated SyslogSender senders = 1;
}

message SyslogGateway {
  string replica = 1;
  // Listeners ("udp [::]:5514").
  repeated string listeners = 2;
}

message GetSyslogSettingsRequest {}

message GetSyslogSettingsResponse {
  // Messages of unregistered senders: "drop" or "accept" (taken in as a
  // temporary device named after the address).
  string unregistered = 1;
  // unregistered is the installation's default, not a stored choice.
  bool unregistered_default = 2;
  // Gateways receiving syslog.
  repeated SyslogGateway gateways = 3;
}

message SetSyslogSettingsRequest {
  string unregistered = 1;
}

message SetSyslogSettingsResponse {}

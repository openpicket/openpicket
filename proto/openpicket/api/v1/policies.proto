syntax = "proto3";

package openpicket.api.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/openpicket/openpicket/gen/openpicket/api/v1;apiv1";

// Port policies: allow or block sources on public (pre-DNAT) ports.
service PolicyService {
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc PutPolicy(PutPolicyRequest) returns (PutPolicyResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
  // Reorders all policies (ids in evaluation order).
  rpc ReorderPolicies(ReorderPoliciesRequest) returns (ReorderPoliciesResponse);
  rpc ListAddressLists(ListAddressListsRequest) returns (ListAddressListsResponse);
  rpc PutAddressList(PutAddressListRequest) returns (PutAddressListResponse);
  rpc DeleteAddressList(DeleteAddressListRequest) returns (DeleteAddressListResponse);
  rpc PolicyHistory(PolicyHistoryRequest) returns (PolicyHistoryResponse);
  // Compiles the bundle a node would receive (preview, no change).
  rpc PreviewBundle(PreviewBundleRequest) returns (PreviewBundleResponse);
}

// MaxMind databases (uploaded; the single source of GeoIP data).
service GeoService {
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse);
  // Upload over HTTP POST /api/geo/upload (multipart, field "file"), the
  // body is too large for a unary call; this deletes a database.
  rpc DeleteDatabase(DeleteDatabaseRequest) returns (DeleteDatabaseResponse);
  rpc Lookup(GeoLookupRequest) returns (GeoLookupResponse);
  // Periodic download from MaxMind with a license key: the leader checks
  // every interval and stores new releases like uploads.
  rpc GetUpdateSettings(GetGeoUpdateSettingsRequest) returns (GetGeoUpdateSettingsResponse);
  rpc SetUpdateSettings(SetGeoUpdateSettingsRequest) returns (SetGeoUpdateSettingsResponse);
  // Checks every configured edition now (also while disabled).
  rpc RunUpdate(RunGeoUpdateRequest) returns (RunGeoUpdateResponse);
}

message PortRange {
  uint32 from = 1;
  uint32 to = 2;
}

message PolicySource {
  repeated string countries = 1;
  repeated uint32 asns = 2;
  repeated string lists = 3;
  repeated string cidrs = 4;
}

message PolicyRule {
  PolicySource source = 1;
  // accept | drop | reject
  string action = 2;
}

message LabelValues {
  repeated string values = 1;
}

message PolicyScope {
  repeated string nodes = 1;
  map<string, LabelValues> labels = 2;
}

message Policy {
  string id = 1;
  string description = 2;
  bool enabled = 3;
  PolicyScope scope = 4;
  // enforce | observe
  string mode = 5;
  // tcp | udp
  string proto = 6;
  repeated PortRange ports = 7;
  repeated PolicyRule rules = 8;
  // accept | drop | reject
  string default_action = 9;
  bool log_drops = 10;
  // Read only.
  int32 position = 11;
  google.protobuf.Timestamp updated_at = 12;
  string updated_by = 13;
  // Read only: why the policy does not compile now ("" when it does),
  // since when, and whether its last good version stays deployed.
  string compile_error = 14;
  google.protobuf.Timestamp compile_error_since = 15;
  bool stale = 16;
}

message ListPoliciesRequest {}
message ListPoliciesResponse {
  repeated Policy policies = 1;
  uint64 version = 2;
}

message PutPolicyRequest {
  Policy policy = 1;
  // Keep the current position (or append) when unset.
  optional int32 position = 2;
}
message PutPolicyResponse {
  uint64 version = 1;
}

message DeletePolicyRequest {
  string id = 1;
}
message DeletePolicyResponse {
  uint64 version = 1;
}

message ReorderPoliciesRequest {
  repeated string ids = 1;
}
message ReorderPoliciesResponse {
  uint64 version = 1;
}

message AddressList {
  string name = 1;
  string description = 2;
  repeated string cidrs = 3;
  repeated uint32 asns = 4;
  google.protobuf.Timestamp updated_at = 5;
  string updated_by = 6;
  // Policies using the list (read only).
  repeated string used_by = 7;
}

message ListAddressListsRequest {}
message ListAddressListsResponse {
  repeated AddressList lists = 1;
}

message PutAddressListRequest {
  AddressList list = 1;
}
message PutAddressListResponse {
  uint64 version = 1;
}

message DeleteAddressListRequest {
  string name = 1;
}
message DeleteAddressListResponse {
  uint64 version = 1;
}

message PolicyHistoryRequest {
  // Empty: all policies and lists ("list:<name>" for lists).
  string policy_id = 1;
  int32 limit = 2;
}

message PolicyChange {
  string policy_id = 1;
  uint64 version = 2;
  // put | delete | reorder
  string action = 3;
  // JSON spec after the change.
  string spec_json = 4;
  google.protobuf.Timestamp changed_at = 5;
  string changed_by = 6;
}

message PolicyHistoryResponse {
  repeated PolicyChange changes = 1;
}

message PreviewBundleRequest {
  string node_id = 1;
}

message SkippedPolicy {
  string policy_id = 1;
  string reason = 2;
  // The last version that compiled is deployed instead (otherwise the
  // policy is left out: it never compiled).
  bool stale = 3;
}

message PreviewBundleResponse {
  uint64 version = 1;
  // Policies in the bundle.
  repeated string policies = 2;
  repeated SkippedPolicy skipped = 3;
  // Total set elements (nftables size).
  uint32 elements = 4;
  // Bundle as JSON (protojson).
  string bundle_json = 5;
}

message GeoDatabase {
  // country | asn
  string kind = 1;
  string database_type = 2;
  google.protobuf.Timestamp build_time = 3;
  string sha256 = 4;
  int64 size = 5;
  google.protobuf.Timestamp uploaded_at = 6;
  string uploaded_by = 7;
}

message ListDatabasesRequest {}
message ListDatabasesResponse {
  repeated GeoDatabase databases = 1;
  // Loaded on this replica.
  bool loaded = 2;
}

message DeleteDatabaseRequest {
  string kind = 1;
}
message DeleteDatabaseResponse {}

message GeoLookupRequest {
  repeated string ips = 1;
}

message GeoResult {
  string ip = 1;
  string country = 2;
  uint32 asn = 3;
  string as_org = 4;
}

message GeoLookupResponse {
  repeated GeoResult results = 1;
}

message GeoUpdateSettings {
  bool enabled = 1;
  // Output only: a license key is stored (it is never returned).
  bool license_key_set = 2;
  // MaxMind edition ids (GetGeoUpdateSettingsResponse lists them); empty
  // skips the kind.
  string country_edition = 3;
  string asn_edition = 4;
  // 1 to 720.
  uint32 interval_hours = 5;
  google.protobuf.Timestamp updated_at = 6;
  string updated_by = 7;
}

message GeoEditionState {
  string edition = 1;
  // Archive of the release, e.g. GeoLite2-Country_20261027.tar.gz.
  string file = 2;
  // sha256 of the database stored.
  string sha256 = 3;
  google.protobuf.Timestamp checked_at = 4;
}

message GeoUpdateStatus {
  google.protobuf.Timestamp last_check_at = 1;
  // Last check that stored a new database.
  google.protobuf.Timestamp last_download_at = 2;
  // Failures of the last check, one line per edition; empty when it
  // succeeded.
  string last_error = 3;
  google.protobuf.Timestamp error_at = 4;
  repeated GeoEditionState editions = 5;
  // Unset while disabled, or when the check is due now.
  google.protobuf.Timestamp next_check_at = 6;
}

message GetGeoUpdateSettingsRequest {}
message GetGeoUpdateSettingsResponse {
  GeoUpdateSettings settings = 1;
  GeoUpdateStatus status = 2;
  repeated string country_editions = 3;
  repeated string asn_editions = 4;
}

message SetGeoUpdateSettingsRequest {
  GeoUpdateSettings settings = 1;
  // Empty keeps the stored key.
  string license_key = 2;
}
message SetGeoUpdateSettingsResponse {
  GeoUpdateSettings settings = 1;
  GeoUpdateStatus status = 2;
}

message RunGeoUpdateRequest {}
// Failed editions are reported in status.last_error, not as an error.
message RunGeoUpdateResponse {
  GeoUpdateStatus status = 1;
}

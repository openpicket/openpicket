{{- $full := include "openpicket.fullname" . }}
{{- $secret := include "openpicket.secret" . }}
{{- $m := .Values.manager }}
{{- $split := .Values.gateway.enabled }}
{{- $osCA := and .Values.opensearch.enabled .Values.opensearch.caSecret }}
{{- $mispCA := and .Values.misp.enabled .Values.misp.external.url .Values.misp.external.caSecret }}
{{- $volumes := or (not $split) $m.auth.config $osCA $mispCA }}
{{- $syslog := and (not $split) .Values.syslog.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}-manager
  labels:
    {{- include "openpicket.componentLabels" (list . "manager") | nindent 4 }}
spec:
  selector:
    {{- include "openpicket.selector" (list . "manager") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}-manager
  labels:
    {{- include "openpicket.componentLabels" (list . "manager") | nindent 4 }}
spec:
  replicas: {{ $m.replicas }}
  selector:
    matchLabels:
      {{- include "openpicket.selector" (list . "manager") | nindent 6 }}
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "openpicket.componentLabels" (list . "manager") | nindent 8 }}
      annotations:
        checksum/auth: {{ toYaml $m.auth | sha256sum | trunc 16 }}
    spec:
      {{- include "openpicket.imagePullSecrets" . | nindent 6 }}
      enableServiceLinks: false
      {{- if not $split }}
      # Agents move to another replica; the replica saves its watermarks
      # first (graceful drain).
      terminationGracePeriodSeconds: 45
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: manager
          image: {{ include "openpicket.image" (list . $m.image) }}
          args: [serve]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            {{- include "openpicket.dbEnv" (list . .Values.database.maxConnections.manager) | nindent 12 }}
            - name: OPENPICKET_REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # UI, API and leader tasks; with the gateways split off, the
            # agents connect to them instead (gateway.yaml).
            - name: OPENPICKET_ROLE
              value: {{ ternary "api" "all" $split }}
            {{- include "openpicket.keySecretEnv" . | nindent 12 }}
            {{- if not $split }}
            - name: OPENPICKET_HOST_KEY_FILE
              value: /secrets/host_key/host_key
            {{- else if .Values.gateway.database.user }}
            # Created (or its password set) and granted on every start.
            - name: OPENPICKET_DB_GATEWAY_ROLE
              value: {{ .Values.gateway.database.user | quote }}
            - name: OPENPICKET_DB_GATEWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- include "openpicket.gatewayDBPasswordRef" . | nindent 18 }}
            {{- end }}
            - name: OPENPICKET_LOG_LEVEL
              value: {{ $m.logLevel | quote }}
            - name: OPENPICKET_PUBLIC_URL
              value: {{ .Values.publicURL | quote }}
            - name: OPENPICKET_TRUST_PROXY_HEADERS
              value: {{ $m.trustProxyHeaders | quote }}
            - name: OPENPICKET_READ_ONLY
              value: {{ $m.readOnly | quote }}
            - name: OPENPICKET_INSECURE_COOKIES
              value: {{ $m.auth.insecureCookies | quote }}
            {{- with $m.allowedOrigins }}
            - name: OPENPICKET_ALLOWED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if $m.auth.admin.enabled }}
            - name: OPENPICKET_ADMIN_USERNAME
              value: {{ $m.auth.admin.username | quote }}
            - name: OPENPICKET_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default $secret $m.auth.admin.existingSecret }}
                  key: {{ ternary $m.auth.admin.passwordKey "admin-password" (not (empty $m.auth.admin.existingSecret)) }}
            {{- end }}
            {{- if $m.auth.config }}
            - name: OPENPICKET_AUTH_CONFIG_FILE
              value: /secrets/auth/auth-config
            {{- end }}
            {{- include "openpicket.lokiEnv" . | nindent 12 }}
            {{- include "openpicket.crowdsecSinkEnv" . | nindent 12 }}
            # CrowdSec LAPI (decisions, alerts) and hub
            {{- with .Values.crowdsec.hub }}
            {{- if .url }}
            - name: OPENPICKET_HUB_URL
              value: {{ .url | quote }}
            {{- end }}
            {{- if .dataHosts }}
            - name: OPENPICKET_HUB_DATA_HOSTS
              value: {{ join "," .dataHosts | quote }}
            {{- end }}
            {{- if .refresh }}
            - name: OPENPICKET_HUB_REFRESH
              value: {{ .refresh | quote }}
            {{- end }}
            {{- end }}
            - name: OPENPICKET_CROWDSEC_METRICS_DISCOVERY_HOSTS
              value: {{ printf "%s-crowdsec-agents,%s-crowdsec-lapi-pods" $full $full | quote }}
            - name: OPENPICKET_LAPI_URL
              value: {{ include "openpicket.lapiURL" . | quote }}
            - name: OPENPICKET_LAPI_BOUNCER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: relay-bouncer-key
            - name: OPENPICKET_LAPI_LOGIN
              value: openpicket-manager
            - name: OPENPICKET_LAPI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: watcher-password
            - name: OPENPICKET_ALERT_RETENTION
              value: {{ $m.alertRetention | quote }}
            {{- with $m.extraLAPIs }}
            - name: OPENPICKET_LAPI_EXTRA
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.suricontroller.enabled }}
            - name: OPENPICKET_SURICONTROLLER_URL
              value: http://{{ $full }}-suricontroller:8080
            {{- with $m.agentControllerURL }}
            - name: OPENPICKET_AGENT_CONTROLLER_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.misp.enabled }}
            - name: OPENPICKET_MISP_URL
              value: {{ include "openpicket.mispURL" . | quote }}
            - name: OPENPICKET_MISP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "openpicket.mispKeySecret" . }}
                  key: {{ include "openpicket.mispKeyKey" . }}
            - name: OPENPICKET_MISP_PROPOSE_MIN_ALERTS
              value: {{ .Values.misp.proposeMinAlerts | quote }}
            - name: OPENPICKET_MISP_PROPOSE_WINDOW
              value: {{ .Values.misp.proposeWindow | quote }}
            - name: OPENPICKET_MISP_DEFAULT_TTL
              value: {{ .Values.misp.defaultTTL | quote }}
            - name: OPENPICKET_MISP_SYNC_INTERVAL
              value: {{ .Values.misp.syncInterval | quote }}
            - name: OPENPICKET_MISP_RENEW
              value: {{ .Values.misp.renew | quote }}
            {{- if .Values.misp.external.url }}
            - name: OPENPICKET_MISP_INSECURE_SKIP_VERIFY
              value: {{ .Values.misp.external.insecureSkipVerify | quote }}
            {{- with .Values.misp.external.caSecret }}
            - name: OPENPICKET_MISP_CA_FILE
              value: /secrets/misp-ca/ca.crt
            {{- end }}
            {{- end }}
            {{- end }}
            {{- include "openpicket.opensearchEnv" . | nindent 12 }}
            {{- include "openpicket.syslogDefaultEnv" . | nindent 12 }}
            {{- if $syslog }}
            {{- include "openpicket.syslogEnv" . | nindent 12 }}
            {{- end }}
            {{- with $m.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
            {{- if $syslog }}
            {{- include "openpicket.syslogPorts" . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml $m.resources | nindent 12 }}
          {{- if $volumes }}
          volumeMounts:
            {{- if not $split }}
            - name: host-key
              mountPath: /secrets/host_key
              readOnly: true
            {{- end }}
            {{- if $m.auth.config }}
            - name: auth
              mountPath: /secrets/auth
              readOnly: true
            {{- end }}
            {{- if $osCA }}
            - name: opensearch-ca
              mountPath: /secrets/opensearch-ca
              readOnly: true
            {{- end }}
            {{- if $mispCA }}
            - name: misp-ca
              mountPath: /secrets/misp-ca
              readOnly: true
            {{- end }}
            {{- if $syslog }}
            {{- include "openpicket.syslogMounts" . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if $volumes }}
      volumes:
        {{- if not $split }}
        - name: host-key
          secret:
            secretName: {{ include "openpicket.hostKeySecret" . }}
            items: [{ key: host_key, path: host_key }]
        {{- end }}
        {{- if $m.auth.config }}
        - name: auth
          secret:
            secretName: {{ $secret }}
            items: [{ key: auth-config, path: auth-config }]
        {{- end }}
        {{- if $osCA }}
        - name: opensearch-ca
          secret:
            secretName: {{ .Values.opensearch.caSecret }}
        {{- end }}
        {{- if $mispCA }}
        - name: misp-ca
          secret:
            secretName: {{ .Values.misp.external.caSecret }}
        {{- end }}
        {{- if $syslog }}
        {{- include "openpicket.syslogVolumes" . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with $m.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $m.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $m.affinity }}
      affinity:
        {{- toYaml $m.affinity | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "openpicket.selector" (list . "manager") | nindent 20 }}
      {{- end }}
{{- if and $m.podDisruptionBudget.enabled (gt (int $m.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $full }}-manager
  labels:
    {{- include "openpicket.componentLabels" (list . "manager") | nindent 4 }}
spec:
  minAvailable: {{ $m.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "openpicket.selector" (list . "manager") | nindent 6 }}
{{- end }}

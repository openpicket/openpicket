{{- if .Values.ingress.enabled }}
{{- $full := include "openpicket.fullname" . }}
{{- $ui := .Values.ingress.ui }}
{{- $agents := ternary (printf "%s-gateway" $full) (printf "%s-manager" $full) .Values.gateway.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}
  labels:
    {{- include "openpicket.labels" . | nindent 4 }}
  annotations:
    # ingress-nginx defaults to 1m; a geo database upload takes up to 257m.
    {{- toYaml (merge (dict) .Values.ingress.annotations (dict "nginx.ingress.kubernetes.io/proxy-body-size" "257m")) | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.suricontroller.enabled }}
          # Agents' channel A (Suricata management).
          - path: /agent/v1/connect
            pathType: Exact
            backend:
              service:
                name: {{ $full }}-suricontroller
                port: { name: http }
          {{- end }}
          # Agents' data plane.
          - path: /agent/data/v1/connect
            pathType: Exact
            backend:
              service:
                name: {{ $agents }}
                port: { name: http }
          {{- if not $ui.enabled }}
          # UI, API and the /suricata/ proxy.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-manager
                port: { name: http }
          {{- end }}
{{- if $ui.enabled }}
---
# The UI and API on their own (internal) host: the agents' ingress above
# then carries the agent paths only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}-ui
  labels:
    {{- include "openpicket.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict) $ui.annotations (dict "nginx.ingress.kubernetes.io/proxy-body-size" "257m")) | nindent 4 }}
spec:
  {{- with $ui.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ui.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "ingress.ui.host is required" $ui.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-manager
                port: { name: http }
{{- end }}
{{- end }}

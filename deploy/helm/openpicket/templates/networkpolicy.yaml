{{- if .Values.networkPolicy.enabled }}
{{- $full := include "openpicket.fullname" . }}
# Anyone who can post to the CrowdSec datasource could make the LAPI ban
# arbitrary addresses, or change its content: only the manager may reach
# the datasource and the content sync.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-crowdsec-agent
  labels:
    {{- include "openpicket.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openpicket.selector" (list . "crowdsec-agent") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "openpicket.selector" (list . "manager") | nindent 14 }}
      ports:
        - port: 8081
        - port: 8082
    - ports:
        - port: 6060
{{- if .Values.database.builtin.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $full }}-postgres
  labels:
    {{- include "openpicket.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openpicket.selector" (list . "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range $c := list "manager" "suricontroller" "crowdsec-lapi" }}
        - podSelector:
            matchLabels:
              {{- include "openpicket.selector" (list $ $c) | nindent 14 }}
        {{- end }}
      ports:
        - port: 5432
{{- end }}
{{- end }}

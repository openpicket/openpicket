{{- $s := include "openpicket.secret" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $s -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s }}
  labels:
    {{- include "openpicket.labels" . | nindent 4 }}
  annotations:
    # Generated values must survive an uninstall/reinstall of the release
    # (agents pin the host key).
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if not .Values.manager.existingHostKeySecret }}
  {{- $key := .Values.manager.hostKey }}
  {{- if and (not $key) $existing (index $existing.data "host_key") }}{{ $key = index $existing.data "host_key" | b64dec }}{{ end }}
  {{- if not $key }}{{ $key = genPrivateKey "ed25519" }}{{ end }}
  host_key: |
    {{- $key | nindent 4 }}
  {{- end }}
  {{- if and .Values.manager.auth.admin.enabled (not .Values.manager.auth.admin.existingSecret) }}
  admin-password: {{ include "openpicket.secretValue" (list . "admin-password" .Values.manager.auth.admin.password 24) | quote }}
  {{- end }}
  {{- if or .Values.database.builtin.enabled (not .Values.database.external.existingSecret) }}
  database-password: {{ include "openpicket.secretValue" (list . "database-password" .Values.database.external.password 32) | quote }}
  {{- end }}
  acquis-token: {{ include "openpicket.secretValue" (list . "acquis-token" "" 40) | quote }}
  relay-bouncer-key: {{ include "openpicket.secretValue" (list . "relay-bouncer-key" "" 40) | quote }}
  watcher-password: {{ include "openpicket.secretValue" (list . "watcher-password" "" 40) | quote }}
  agents-password: {{ include "openpicket.secretValue" (list . "agents-password" "" 40) | quote }}
  {{- range $name, $key := .Values.crowdsec.bouncers }}
  bouncer-{{ $name }}: {{ include "openpicket.secretValue" (list $ (printf "bouncer-%s" $name) $key 40) | quote }}
  {{- end }}
  {{- if .Values.manager.auth.config }}
  auth-config: |
    {{- toYaml .Values.manager.auth.config | nindent 4 }}
  {{- end }}
  {{- if and (not .Values.loki.builtin.enabled) .Values.loki.external.password (not .Values.loki.external.existingSecret) }}
  loki-password: {{ .Values.loki.external.password | quote }}
  {{- end }}
  {{- if and .Values.opensearch.enabled .Values.opensearch.password (not .Values.opensearch.existingSecret) }}
  opensearch-password: {{ .Values.opensearch.password | quote }}
  {{- end }}

# The configuration (openpicket.headers may carry credentials).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "collector.fullname" . }}-config
  labels: {{- include "collector.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    {{- include "collector.config" . | nindent 4 }}
  {{- with .Values.openpicket.caCert }}
  ca.crt: |
    {{- . | nindent 4 }}
  {{- end }}
{{- if not .Values.key.existingSecret }}
---
# The node key: the given one, else the one already in the cluster, else a
# new one. Kept on uninstall: OpenPicket has its public key registered.
{{- $name := include "collector.keySecret" . }}
{{- $key := .Values.key.privateKey }}
{{- if not $key }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing (index $existing.data "agent_ed25519") }}
{{- $key = index $existing.data "agent_ed25519" | b64dec }}
{{- else }}
{{- $key = genPrivateKey "ed25519" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "collector.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  agent_ed25519: {{ $key | b64enc }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-collector
  namespace: openpicket-k8s-collector
  labels: { app.kubernetes.io/name: openpicket-agent-k8s-collector }
spec:
  # One replica: a second one would ship every line twice, and a node key
  # has one session at a time.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: openpicket-agent-k8s-collector }
  template:
    metadata:
      labels: { app.kubernetes.io/name: openpicket-agent-k8s-collector }
    spec:
      serviceAccountName: k8s-collector
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: collector
          image: ghcr.io/openpicket/openpicket-agent-k8s-collector:latest   # pin the release you run
          args: [run, -config, /etc/openpicket-agent-k8s-collector/config.yaml]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/openpicket-agent-k8s-collector/config.yaml, subPath: config.yaml, readOnly: true }
            - { name: key, mountPath: /etc/openpicket-agent-k8s-collector/key, readOnly: true }
            - { name: state, mountPath: /var/lib/openpicket-agent-k8s-collector }
      volumes:
        - name: config
          configMap: { name: k8s-collector-config }
        - name: key
          secret: { secretName: k8s-collector-key, defaultMode: 0440 }
        # The positions; the persistent-state component puts them on a PVC.
        - name: state
          emptyDir: {}

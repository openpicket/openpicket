# Keeps the collector's positions on a PVC: after a pod restart every
# container resumes after its last acknowledged line, and pods started
# meanwhile are read from the last save.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - pvc.yaml
patches:
  - target: { kind: Deployment, name: k8s-collector }
    patch: |
      - op: replace
        path: /spec/template/spec/volumes/2
        value:
          name: state
          persistentVolumeClaim: { claimName: k8s-collector-state }
